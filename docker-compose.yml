services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pubmed
      POSTGRES_USER: pubmed
      POSTGRES_PASSWORD: pubmed
    ports:
      - "127.0.0.1:5432:5432"   # local only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pubmed -d pubmed"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
